experiment:
  name: "benchmark-circular-10"
  total_runs: 1          
  dim: 2                  # Dimension of the geometry
  output_dir: "results/stress_mats"

geometry:
  type: "circular"       # Options: circular, random
  num_nodes: 10
  radius: 2.0

custom_algs:
  custom_generic: true
  custom_usi: true
  custom_mc: false

# Custom Algorithm Hyperparameters
opt_hyperparam_set_1:
  alpha: 0.5
  beta: 1.0
  gamma: 0.1

opt_hyperparam_set_2:
  alpha: 1.5
  beta: 1
  gamma: 0.1

opt_hyperparam_set_3:
  alpha: 5
  beta: 1
  gamma: 0.1

# Toggle which comparisons to run 
baselines:
  yang2019: true
  xiao2022: true    
  li2026: true
  lin2016: true

evaluation:
  # Where the .npy files are located
  input_dir: "results/stress_mats"
  
  # Where to save the plots
  output_dir: "results/benchmark-plots"

  sparse_tol: 1e-5       # Tolerance for counting edges

  line_colors:
    # MATCH EXACTLY with python script outputs
    custom_1: "#069AF3"
    custom_2: "orchid"
    custom_3: "yellowgreen"
    
    # Baselines
    yang2019: "salmon"
    xiao2022: "orange"
    li2026: "blue"
    lin2016: "cyan"

  line_markers:
    custom_1: "o"
    custom_2: "s"
    custom_3: "^"
    
    yang2019: "D"
    xiao2022: "v"
    li2026: "<"
    lin2016: ">"
  
  afc_params:
    max_itr: 5000
    dt: 0.01
    gain: 80